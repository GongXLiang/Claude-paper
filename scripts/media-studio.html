<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Claude Paper media studio</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1000px;overflow:hidden}canvas{display:block;width:1600px;height:1000px}</style>
<canvas id="art" width="1600" height="1000" aria-label="Native Orca captures composed for Claude Paper"></canvas>
<script>
// This compositor only crops/scales native captures. Never put raw captures in the public repository.
// Supply a private capture directory as ?raw=file:///.../ and select ?scene=cover|chat-light|...
const params=new URLSearchParams(location.search), scene=params.get('scene')||'cover';
const raw=params.get('raw')||'./', canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const dark=scene.endsWith('-dark'), p=dark?{bg:'#201F1D',ink:'#EDEBE6',muted:'#B5B2AB',line:'#464541'}:{bg:'#F3F2EF',ink:'#1F1E1C',muted:'#65625C',line:'#DEDDD8'};
const shots={};
function text(value,x,y,size=20,color=p.ink,font='"Segoe UI","Microsoft YaHei",sans-serif',weight='400'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.fillText(value,x,y);}
function plate(x,y,w,h,fill,r=10){ctx.save();ctx.shadowColor='#17161322';ctx.shadowBlur=25;ctx.shadowOffsetY=12;ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.restore();}
function crop(name,sx,sy,sw,sh,x,y,w,h,r=0){if(w>sw+.01||h>sh+.01)throw Error('No enlargement');ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();ctx.drawImage(shots[name],sx,sy,sw,sh,x,y,w,h);ctx.restore();}
function foot(label='ORCA 1.4.255 · PUBLIC DEMO · NATIVE CAPTURES'){text(label,40,979,13,p.muted);ctx.textAlign='right';text('Claude Paper · Unofficial community theme',1560,979,13,p.muted);ctx.textAlign='left';}
function heading(title,subtitle,mode){text('Claude Paper',40,66,40,p.ink,'Georgia,serif');text(title,350,65,28,p.ink);text(subtitle,40,103,18,p.muted);ctx.textAlign='right';text(mode||'',1560,66,18,p.muted);ctx.textAlign='left';}
function tabstrip(name,x,y,w){crop(name,14,3,2560,62,x,y,w,62*w/2560);}
function chat(mode){let n='chat-'+mode;heading('对话，有了温度。','真实任务、清晰回复，与原生输入框。',mode==='light'?'暖纸 / LIGHT':'暖夜 / DARK');let x=40,y=129,w=1520,s=w/2560,top=62*s;plate(x,y,w,top+1290*s,mode==='light'?'#F9F8F5':'#2A2927');tabstrip(n,x,y,w);crop(n,14,460,1734,1290,x,y+top,1734*s,1290*s);crop(n,1748,66,826,1290,x+1734*s,y+top,826*s,1290*s);foot();}
function editor(mode){let n='editor-'+mode;heading('代码，读得更从容。','语法层次、行号与文件图标，留在同一张纸上。',mode==='light'?'暖纸 / LIGHT':'暖夜 / DARK');let x=40,y=129,w=1520,s=w/2560,top=62*s;plate(x,y,w,top+1300*s,mode==='light'?'#F9F8F5':'#2A2927');tabstrip(n,x,y,w);crop(n,14,126,1734,1300,x,y+top,1734*s,1300*s);crop(n,1748,66,826,1300,x+1734*s,y+top,826*s,1300*s);foot();}
function diff(mode){let n='diff-'+mode,t='terminal-'+mode;heading('每一行改动，都有分寸。','真实代码差异 + 实际测试输出 · 同一公开 date-kit 任务',mode==='light'?'暖纸 / LIGHT':'暖夜 / DARK');let fill=mode==='light'?'#F9F8F5':'#2A2927';plate(40,140,1030,342,fill);crop(n,14,126,1734,500,40,159,1030,500*1030/1734);plate(40,506,1030,440,fill);crop(t,14,209,1734,640,64,532,982,640*982/1734);plate(1094,140,466,806,mode==='light'?'#F3F2EF':'#201F1D');crop(n,1748,140,826,1428,1094,140,466,1428*466/826);foot();}
function terminal(mode){let n='terminal-'+mode;heading('终端，也是一体的。','真实测试输出 · 16 色 ANSI · 光标与选区配色',mode==='light'?'暖纸 / LIGHT':'暖夜 / DARK');let x=140,y=132,w=1320,s=w/1734;plate(x,y,w,1064*s,mode==='light'?'#F9F8F5':'#2A2927');crop(n,14,3,1734,62,x,y,w,62*s);crop(n,14,66,1734,1002,x,y+62*s,w,1002*s);foot();}
function icons(){heading('纸折图标，认得每一种文件。','源代码、文档、测试与配置 · 一套原创图标，明暗共用。','PAPER FOLD ICONS');for(const [mode,x]of[['light',260],['dark',820]]){let n='editor-'+mode;plate(x,144,520,802,mode==='light'?'#F3F2EF':'#201F1D');crop(n,1748,140,826,1274,x,144,520,1274*520/826);text(mode==='light'?'暖纸 / LIGHT':'暖夜 / DARK',x+22,914,16,mode==='light'?'#65625C':'#B5B2AB');}foot();}
function cli(){heading('同一段输出，看见配色的边界。','ANSI 随终端色板变化；24 位真彩色由程序指定。','TERMINAL COMPARISON');for(const [name,x,label,fill]of[['terminal-baseline',40,'Ghostty Default Style Dark','#282C34'],['terminal-dark',816,'Claude Paper · 暖夜','#2A2927']]){plate(x,144,744,696,fill);text(label,x+24,187,22,'#EDEBE6');crop(name,14,210,1280,830,x+18,220,708,830*708/1280);text('Same command. Same output.',x+24,794,16,'#B5B2AB');}text('对比中 Truecolor #D97757 一行保持相同。主题不改写 CLI 的布局或程序硬编码的颜色。',40,905,22,p.muted);foot();}
function cover(){text('Claude Paper',40,79,52,p.ink,'Georgia,serif');text('让 Orca 更接近你喜欢的 Claude 质感。',408,77,26,p.muted);ctx.textAlign='right';text('暖纸 · 暖夜 · 纸折图标',1560,58,19,p.ink);text('Unofficial community theme',1560,91,14,p.muted);ctx.textAlign='left';
 plate(40,140,880,810,'#F9F8F5');ctx.save();ctx.beginPath();ctx.roundRect(40,140,880,810,10);ctx.clip();crop('chat-light',14,3,1734,62,40,140,880,62*880/1734);crop('chat-light',140,460,1460,1288,40,171.46,880,1288*880/1460);ctx.restore();
 plate(952,140,608,432,'#201F1D');text('PAPER FOLD  /  原生文件树',978,180,17,'#B5B2AB');crop('editor-dark',1748,352,826,710,1041,195,430,710*430/826);
 plate(952,596,608,354,'#2A2927');text('TERMINAL  /  暖夜',978,632,17,'#B5B2AB');crop('terminal-dark',14,210,1280,630,966,651,578,630*578/1280);
 foot('CHAT · CODE · DIFF · TERMINAL · ICONS');}
async function main(){ctx.fillStyle=p.bg;ctx.fillRect(0,0,1600,1000);let needs=scene==='cover'?['chat-light','editor-dark','terminal-dark']:scene==='icons'?['editor-light','editor-dark']:scene==='cli-compare'?['terminal-baseline','terminal-dark']:scene.startsWith('diff-')?[scene,'terminal-'+(dark?'dark':'light')]:[scene];for(const n of needs){let image=new Image();image.src=raw+'p03-'+n+'-raw.png';await image.decode();if(image.width!==2586||image.height!==1880)throw Error('Unexpected capture size '+n);shots[n]=image;}if(scene==='cover')cover();else if(scene==='icons')icons();else if(scene==='cli-compare')cli();else if(scene.startsWith('chat-'))chat(dark?'dark':'light');else if(scene.startsWith('editor-'))editor(dark?'dark':'light');else if(scene.startsWith('diff-'))diff(dark?'dark':'light');else if(scene.startsWith('terminal-'))terminal(dark?'dark':'light');else throw Error('Unknown scene');document.documentElement.dataset.ready='true';}
main().catch(e=>{document.documentElement.dataset.error=e.message;throw e;});
</script></html>
